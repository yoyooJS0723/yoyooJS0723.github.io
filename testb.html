<!DOCTYPE html>
<body>
  <img src="https://yoyoojs0723.github.io/dineso.png" style="position: fixed;width: 100px;height: 100px;left: 10px;top: 10px;z-index: 724;" id="pet">
  <div style="position:fixed;bottom:50px;left:50px;width:200px;height:200px;background-color:#000000" id="left"></div>
  <div style="position:fixed;bottom:50px;left:500px;width:200px;height:200px;background-color:#000000" id="right"></div>
  <div style="position:fixed;bottom:50px;right:50px;width:200px;height:200px;background-color:#000000" id="jump"></div>
</body>
<script>
    const move = {
        x : 10,
        y : 10,
        down_t : 0,
        bottom : (window.innerHeight/10*9),
        life : 0
    };
    let movefb = null;
    const movef = function(){
        const pet = document.getElementById("pet");
        document.getElementById("left").addEventListener("click",function(){
          move.x += -10/100;
        })
        document.getElementById("right").addEventListener("click",function(){
          move.x += 10/100;
        })
        if (move.y < (window.innerHeight/10*9 || move.down_t < 0)){
            move.down_t += 1;
            move.y += 4.9*(move.down_t**2-1)/1000;
        }
        if (move.y > (window.innerHeight/10*9)){
            move.y = (window.innerHeight/10*9);
            move.down_t = 0;
        }
        window.addEventListener("keydown", function(e) {
            move.life = 0;
            if (e.key === "a") {
                move.x += -5/1000;
            }
            if (e.key === "d") {
                move.x += 5/1000;
            }
        });
        pet.style.top = `${move.y}px`;
        pet.style.left = `${move.x}px`;
        move.life += 1;
        if (move.life === 1000){
          clearInterval(movefb);
          movefb = null;
          pet.style.top = "10px";
          pet.style.left = "10px";
          move.life = 0;
          move.down_t = 0;
        }
    }
    const movefa = function(){
        if (movefb === null) {
        movefb = setInterval(movef, 50);
        }
    };
    document.getElementById("pet").addEventListener("click",movefa)
</script>
