<!DOCTYPE html>
<html>
<head>
<style>
.body{
    background-color: #4d4d4d;
    font-family: sans-serif;
    margin: 0px;
}
.title{
    width: 100%;
    height: 200px;
    text-align: center;
    align-items: center;
    background-color: #177faf;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, "Microsoft JhengHei", monospace;
    font-size: 100px;
    color: #ffffff;
}
.m{
    display: flex;
    align-items: center;
}
.menu{
    flex: 3;
    background-color: #636363;
}
.main{
    flex: 7;
    background-color: #E6EFF4;
    align-items: center;
}
.all_list{
    align-items: center;
    background-color: #e6e6fa;
    margin: 20px;
}
.all_list_item {
    margin-left: 5px;
    list-style-type: none;
    list-style-image: none;
}
.all_list_item::before {
    content: "";
    position: absolute;
    transform: translateY(-10px);
    width: 10px;
    height: 20px;
    border-left: 3px solid #636363;
    border-bottom: 3px solid #636363;
}
.all_list_item_text{
    padding: 15px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, "Microsoft JhengHei", monospace;
}
.item{
    margin: 0px 20px;
    font-size: 32px;
}
.p{
    margin: 20px 20px;
    font-family: sans-serif;
    font-size: 16px;
}
.code{
    padding: 1px 4px;
    background-color: #ffffff;
    font-family: monospace, monospace;
    font-size: smaller;
    display: inline-block;
    font-size: 32px;
}
.list_t{
    background-color: #a2a9be;
    margin: 0px 20px;
}
.list_a{
    background: #eaecf0;
    padding: 10px;
    text-align: center;
    font-size: 16px;
}
.list{
    padding: 10px;
    background: #ffffff;
    text-align: center;
    font-size: 16px;
}
</style>
</head>
<body class="body">
<div class="title">Python解析</div>
<div class="m">
    <div class="menu">111</div>
    <div class="main">
        <div class="all_list">
            <p>總覽表</p>
            <lu>
                <li class="all_list_item">
                    <a class="all_list_item_text">變量</a>
                </li>
                <li class="all_list_item">
                    <a class="all_list_item_text">循環</a>
                </li>
                <li class="all_list_item">
                    <a class="all_list_item_text">函數</a>
                </li>
            </lu>
        </div>
        <div class="item" id="x"><strong>變量</strong>
            <p class="p">
            <code class="code"><參數> = < value ></code>
            <br>
                value的種類如下:
                <table class="list_t">
                    <tbody>
                        <tr>
                            <td class="list_a">整數 int</td>
                            <td class="list_a">小數 float</td>
                            <td class="list_a">字串 str</td>
                            <td class="list_a">布林值 boolean</td>
                            <td class="list_a">列表 list</td>
                        </tr>
                        <tr>
                            <td class="list">1、2、3</td>
                            <td class="list">0.1、0.2</td>
                            <td class="list">"123"、"string"</td>
                            <td class="list">True、Flase</td>
                            <td class="list">[1,"123"]、["string",True]</td>
                        </tr>
                    </tbody>
                </table>
            </p>
        </div>
    </div>
</div>
<script>
</script>
</body>
</html>
